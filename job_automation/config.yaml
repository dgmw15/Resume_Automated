# config.yaml — Runtime settings

search:
  # Fallback roles used only if the Excel file below is missing or the sheet is empty
  keywords:
    - "Software Engineer"
    - "Backend Developer"
  locations:
    - "Singapore"
  # Load job roles from an Excel file (takes priority over keywords above)
  roles_excel:
    path: "job_roles.xlsx"    # path relative to job_automation/
    sheet: "Roles"            # sheet name
    column: "Job Role"        # column header in that sheet

portals:
  careersfuture:
    enabled: true
    max_actions_per_hour: 30
    min_delay_seconds: 5
    max_delay_seconds: 15
  indeed:
    enabled: true
    max_actions_per_hour: 20
    min_delay_seconds: 8
    max_delay_seconds: 20
  jobstreet:
    enabled: false
    max_actions_per_hour: 15
    min_delay_seconds: 10
    max_delay_seconds: 25

# Legacy Vertex AI config kept for reference — no longer used in active execution path
vertex_ai:
  project_id: ""          # GCP project ID
  location: "us-central1"
  model: "gemini-1.5-pro"

excel:
  path: "Database.xlsx"

session:
  reauth_buffer_minutes: 5   # Re-authenticate this many minutes before expiry

# ---------------------------------------------------------------------------
# Salary extraction — CareersFuture selector-driven parsing
# ---------------------------------------------------------------------------
salary:
  capture_on_listing: true          # Attempt salary extraction on listing cards
  capture_on_detail_fallback: true  # Try detail page if listing-level salary is missing
  default_currency: "SGD"
  parse_locale: "en-SG"
  enable_period_inference: true     # Infer monthly/annual from raw text context
  selectors:
    careersfuture:
      range: "span[data-testid='salary-range']"
      min_amount: "span[data-testid='salary-range'] span.dib:nth-of-type(1)"
      max_amount: "span[data-testid='salary-range'] span.dib:nth-of-type(2)"

# ---------------------------------------------------------------------------
# Employment type filtering — internship and contract toggles
# ---------------------------------------------------------------------------
employment_filter:
  enabled: true
  exclude_internship: true       # Filter out internship/trainee roles
  exclude_contract: false        # Filter out contract/fixed-term roles
  filter_stage: "pre_validation" # Applied before JD technical validation
  unknown_policy: "allow"        # "allow" or "deny" when type cannot be determined

# ---------------------------------------------------------------------------
# Validation — deterministic JD relevance gate (no AI calls)
# ---------------------------------------------------------------------------
validation:
  min_keyword_hits: 3          # Minimum technical keywords required to pass
  role_keyword_sets:
    analyst:
      - "sql"
      - "python"
      - "tableau"
      - "power bi"
      - "bi"
      - "dashboard"
      - "analytics"
      - "metrics"
      - "kpi"
      - "reporting"
      - "data analysis"
      - "excel"
      - "a/b test"
      - "experimentation"
      - "stakeholder"
    engineer:
      - "sql"
      - "python"
      - "etl"
      - "elt"
      - "pipeline"
      - "spark"
      - "airflow"
      - "dbt"
      - "kafka"
      - "data warehouse"
      - "bigquery"
      - "redshift"
      - "snowflake"
      - "orchestration"
      - "cloud"
      - "aws"
      - "gcp"
      - "azure"
  deny_patterns:
    - "insurance agent"
    - "financial advisor"
    - "sales agent"
    - "commission only"
    - "life insurance"
    - "unit trust"
    - "financial planner"
    - "wealth management advisor"
    - "recruitment consultant"

# ---------------------------------------------------------------------------
# Batch processing — 24-hour SLA window
# ---------------------------------------------------------------------------
batch:
  enabled: true
  interval_minutes: 30         # How often the batch worker runs
  batch_size: 5                # Max jobs processed per run
  target_sla_hours: 24         # Target time-to-complete for queued jobs
  max_retries: 3               # Max AI call retries before marking FAILED

# ---------------------------------------------------------------------------
# AI provider routing
# ---------------------------------------------------------------------------
ai:
  provider: "anthropic"        # Primary provider: "claude_code", "openrouter", or "anthropic"
  fallback_order:
    # claude_code (Phase 2B, subscription-billed) is tried first but self-skips
    # via EnvironmentError today because ANTHROPIC_API_KEY is set — falls
    # straight through to anthropic. Unset ANTHROPIC_API_KEY to actually use it.
    - "claude_code"
    - "anthropic"
    - "openrouter"
  model_map:
    analyst: "claude-sonnet-4-6"
    engineer: "claude-sonnet-4-6"
  budget:
    daily_cap_usd: 5.00
    monthly_cap_usd: 50.00
    hard_stop: true            # If true, raise BudgetExceededError when cap hit
    budget_timezone: "UTC"     # Timezone for daily reset boundary (e.g. "Asia/Singapore")
    budget_precision_decimals: 4   # Decimal places for cost comparisons and rounding
    cost_lock_timeout_seconds: 60  # Seconds before an unconfirmed reservation is expired
    reservation_cleanup_interval_seconds: 300  # How often the cleanup cadence runs

# ---------------------------------------------------------------------------
# Resume tailoring — ATS critic layer (Sub-project B)
# ---------------------------------------------------------------------------
resume_tailoring:
  # When true, every successfully tailored job also gets a second, best-effort
  # AI call that critiques (never rewrites) the tailored resume against the
  # JD — surfaced in the review UI as coverage %, missing keywords, and a
  # PASS/WEAK/FAIL verdict. A critique failure never fails the job. The free
  # deterministic keyword-coverage check always runs regardless of this flag.
  enable_ats_critic: true

# ---------------------------------------------------------------------------
# Output — generated artifacts
# ---------------------------------------------------------------------------
output:
  docx_output_dir: "output/docs"
  docx_template_path: ""       # Optional: path to a .docx template file
  docx_temp_retention_hours: 24   # How long failed-validation temp files are kept before deletion
  docx_validation_required_sections: []  # e.g. ["EXPERIENCE", "SKILLS"] — empty means any non-empty body passes

# ---------------------------------------------------------------------------
# Data completeness checker — audit and optional deterministic backfill
# Phase A/B: trawl workbook only. Phase D: extend to tracker after schema parity.
# ---------------------------------------------------------------------------
data_checker:
  enabled: false                  # Master toggle. Set true to run checker on startup.
  run_stage: "pre_pipeline"       # When to run: "pre_pipeline" (after scrape, before filters)

  # Mode controls
  mode: "audit_only"              # "audit_only" (report, no writes) | "recover" (backfill + report)
  dry_run: true                   # Always default to dry-run. Set false only when ready to mutate.

  # Target workbooks — Phase A/B: trawl only. Extend to tracker in Phase D.
  targets:
    - "trawl_results.xlsx"
    # - "Database.xlsx"           # Uncomment in Phase D after tracker gains salary schema parity

  # Backup behaviour
  write_backup: true              # Create timestamped backup copy before any mutation
  backup_retention_days: 7        # Delete backups older than this many days

  # Backfill controls
  backfill:
    allow_portal_refetch: false   # Phase C only: allow network re-fetch for unresolved rows
    portals_allowed_for_refetch:  # Limit refetch to tested portals
      - "careersfuture"
    max_rows_per_run: 50          # Cap backfill/refetch rows per execution to limit blast radius
    unresolved_reason_required: true  # Every UNRESOLVED row must carry an explicit reason string

  # Report output
  report_path: "output/logs/completeness_report_{date}.json"
  recovery_report_path: "output/logs/recovery_report_{date}.json"
  issue_workbook_path: ""         # Optional: "output/logs/unresolved_{date}.xlsx" — blank to skip

# ---------------------------------------------------------------------------
# Dataframe engine — controls Excel role-loading backend
# Phase P2/P3: pandas default with Polars available behind config flag.
# Phase P5: switch engine to "polars" once parity is confirmed.
# ---------------------------------------------------------------------------
dataframe:
  engine: "polars"                   # "pandas" | "polars"
  allow_fallback_to_pandas: true     # Polars failure → pandas retry (safe default)
