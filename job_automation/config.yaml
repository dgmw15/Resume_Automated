# config.yaml — Runtime settings

search:
  # Fallback roles used only if the Excel file below is missing or the sheet is empty
  keywords:
    - "Software Engineer"
    - "Backend Developer"
  locations:
    - "Singapore"
  # Load job roles from an Excel file (takes priority over keywords above)
  roles_excel:
    path: "job_roles.xlsx"    # path relative to job_automation/
    sheet: "Roles"            # sheet name
    column: "Job Role"        # column header in that sheet

portals:
  careersfuture:
    enabled: true
    max_actions_per_hour: 30
    min_delay_seconds: 5
    max_delay_seconds: 15
  indeed:
    enabled: true
    max_actions_per_hour: 20
    min_delay_seconds: 8
    max_delay_seconds: 20
  jobstreet:
    enabled: false
    max_actions_per_hour: 15
    min_delay_seconds: 10
    max_delay_seconds: 25

# Legacy Vertex AI config kept for reference — no longer used in active execution path
vertex_ai:
  project_id: ""          # GCP project ID
  location: "us-central1"
  model: "gemini-1.5-pro"

excel:
  path: "Database.xlsx"

session:
  reauth_buffer_minutes: 5   # Re-authenticate this many minutes before expiry

# ---------------------------------------------------------------------------
# Salary extraction — CareersFuture selector-driven parsing
# ---------------------------------------------------------------------------
salary:
  capture_on_listing: true          # Attempt salary extraction on listing cards
  capture_on_detail_fallback: true  # Try detail page if listing-level salary is missing
  default_currency: "SGD"
  parse_locale: "en-SG"
  enable_period_inference: true     # Infer monthly/annual from raw text context
  selectors:
    careersfuture:
      range: "span[data-testid='salary-range']"
      min_amount: "span[data-testid='salary-range'] span.dib:nth-of-type(1)"
      max_amount: "span[data-testid='salary-range'] span.dib:nth-of-type(2)"

# ---------------------------------------------------------------------------
# Employment type filtering — internship and contract toggles
# ---------------------------------------------------------------------------
employment_filter:
  enabled: true
  exclude_internship: true       # Filter out internship/trainee roles
  exclude_contract: false        # Filter out contract/fixed-term roles
  filter_stage: "pre_validation" # Applied before JD technical validation
  unknown_policy: "allow"        # "allow" or "deny" when type cannot be determined

# ---------------------------------------------------------------------------
# Validation — deterministic JD relevance gate (no AI calls)
# ---------------------------------------------------------------------------
validation:
  min_keyword_hits: 3          # Minimum technical keywords required to pass
  role_keyword_sets:
    analyst:
      - "sql"
      - "python"
      - "tableau"
      - "power bi"
      - "bi"
      - "dashboard"
      - "analytics"
      - "metrics"
      - "kpi"
      - "reporting"
      - "data analysis"
      - "excel"
      - "a/b test"
      - "experimentation"
      - "stakeholder"
    engineer:
      - "sql"
      - "python"
      - "etl"
      - "elt"
      - "pipeline"
      - "spark"
      - "airflow"
      - "dbt"
      - "kafka"
      - "data warehouse"
      - "bigquery"
      - "redshift"
      - "snowflake"
      - "orchestration"
      - "cloud"
      - "aws"
      - "gcp"
      - "azure"
  deny_patterns:
    - "insurance agent"
    - "financial advisor"
    - "sales agent"
    - "commission only"
    - "life insurance"
    - "unit trust"
    - "financial planner"
    - "wealth management advisor"
    - "recruitment consultant"

# ---------------------------------------------------------------------------
# Batch processing — 24-hour SLA window
# ---------------------------------------------------------------------------
batch:
  enabled: true
  interval_minutes: 30         # How often the batch worker runs
  batch_size: 5                # Max jobs processed per run
  target_sla_hours: 24         # Target time-to-complete for queued jobs
  max_retries: 3               # Max AI call retries before marking FAILED

# ---------------------------------------------------------------------------
# AI provider routing
# ---------------------------------------------------------------------------
ai:
  provider: "anthropic"        # Primary provider: "openrouter" or "anthropic"
  fallback_order:
    - "anthropic"
    - "openrouter"
  model_map:
    analyst: "claude-sonnet-4-6"
    engineer: "claude-sonnet-4-6"
  budget:
    daily_cap_usd: 5.00
    monthly_cap_usd: 50.00
    hard_stop: true            # If true, raise BudgetExceededError when cap hit
    budget_timezone: "UTC"     # Timezone for daily reset boundary (e.g. "Asia/Singapore")
    budget_precision_decimals: 4   # Decimal places for cost comparisons and rounding
    cost_lock_timeout_seconds: 60  # Seconds before an unconfirmed reservation is expired
    reservation_cleanup_interval_seconds: 300  # How often the cleanup cadence runs

# ---------------------------------------------------------------------------
# Output — generated artifacts
# ---------------------------------------------------------------------------
output:
  docx_output_dir: "output/docs"
  docx_template_path: ""       # Optional: path to a .docx template file
  docx_temp_retention_hours: 24   # How long failed-validation temp files are kept before deletion
  docx_validation_required_sections: []  # e.g. ["EXPERIENCE", "SKILLS"] — empty means any non-empty body passes
